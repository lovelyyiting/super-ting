<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生管即時看板</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 身份選擇視圖 */
        .identity-view {
            padding: 40px 20px;
            text-align: center;
        }

        .identity-view h2 {
            margin-bottom: 30px;
            color: #333;
        }

        .identity-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .identity-btn {
            padding: 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .identity-btn.staff {
            background: #667eea;
            color: white;
        }

        .identity-btn.staff:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .identity-btn.manager {
            background: #f093fb;
            color: white;
        }

        .identity-btn.manager:hover {
            background: #e080e8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .identity-btn.viewer {
            background: #4facfe;
            color: white;
        }

        .identity-btn.viewer:hover {
            background: #3d9aed;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        /* 主視圖 */
        .main-view {
            display: none;
            padding: 20px;
        }

        .main-view.active {
            display: block;
        }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .view-header h2 {
            color: #333;
        }

        .logout-btn {
            padding: 8px 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        /* 工作列表 */
        .work-section {
            margin-bottom: 30px;
        }

        .work-section h3 {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            color: #333;
        }

        .work-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .work-content {
            flex: 1;
            min-width: 200px;
        }

        .work-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .work-note {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .work-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-doing {
            background: #fff3cd;
            color: #856404;
        }

        .status-waiting {
            background: #f8d7da;
            color: #721c24;
        }

        .status-done {
            background: #d4edda;
            color: #155724;
        }

        .work-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .work-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .edit-btn {
            background: #667eea;
            color: white;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
        }

        .assign-btn {
            background: #f093fb;
            color: white;
        }

        /* 新增工作表單 */
        .add-work-form {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .submit-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn:hover {
            background: #5568d3;
        }

        .cancel-btn {
            padding: 10px 20px;
            background: #ccc;
            color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 公布欄 */
        .announcement-section {
            background: #fffacd;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .announcement-section h3 {
            color: #b8860b;
            margin-bottom: 15px;
        }

        .announcement-item {
            background: white;
            border-left: 4px solid #ffd700;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .announcement-author {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .announcement-time {
            font-size: 11px;
            color: #ccc;
        }

        /* 戰情室 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .staff-card {
            background: #f9f9f9;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
        }

        .staff-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            border-left: 3px solid #667eea;
        }

        .stat-label {
            font-size: 10px;
            color: #999;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
        }

        /* 密碼輸入 */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .password-modal.active {
            display: flex;
        }

        .password-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .password-box h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .password-box input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 15px;
            width: 200px;
        }

        .password-box button {
            padding: 10px 20px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .password-submit {
            background: #667eea;
            color: white;
        }

        .password-cancel {
            background: #ccc;
            color: #333;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }

            .identity-buttons {
                grid-template-columns: 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .work-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .view-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 生管即時看板</h1>
            <p>實時掌握工作進度，協作無縫接軌</p>
        </div>

        <!-- 身份選擇 -->
        <div id="identityView" class="identity-view active">
            <h2>請選擇身份登入</h2>
            <div class="identity-buttons">
                <button class="identity-btn staff" onclick="selectIdentity('stella')">👩‍💼 Stella</button>
                <button class="identity-btn staff" onclick="selectIdentity('xiaole')">👩‍💼 小樂</button>
                <button class="identity-btn staff" onclick="selectIdentity('lingjia')">👩‍💼 伶佳</button>
                <button class="identity-btn manager" onclick="selectIdentity('christine')">👔 Christine</button>
                <button class="identity-btn viewer" onclick="selectIdentity('penny')">👑 Penny</button>
            </div>
        </div>

        <!-- 生管視圖 -->
        <div id="staffView" class="main-view">
            <div class="view-header">
                <h2>📋 我的工作清單</h2>
                <button class="logout-btn" onclick="logout()">登出</button>
            </div>

            <div id="staffAlerts"></div>

            <div class="announcement-section">
                <h3>📢 公布欄</h3>
                <div id="staffAnnouncementList"></div>
                <div style="margin-top: 15px; border-top: 1px solid #ffd700; padding-top: 15px;">
                    <textarea id="staffAnnouncement" placeholder="分享訊息..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                        <select id="staffAnnouncementImportance" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                            <option value="普通">普通</option>
                            <option value="重要">重要</option>
                            <option value="緊急">緊急</option>
                        </select>
                        <button onclick="postAnnounceAsStaff()" class="submit-btn" style="margin-top: 0; flex: 1;">發布</button>
                    </div>
                </div>
            </div>

            <div class="announcement-section" style="background: #eef5ff; border-color: #7fb3ff;">
                <h3>🚚 近期出貨需求</h3>
                <div id="staffShipmentList"></div>
                <div style="margin-top: 15px; border-top: 1px solid #7fb3ff; padding-top: 15px;">
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="date" id="staffShipDate" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <input type="text" id="staffShipText" placeholder="客戶 / 品名 / 數量..." style="flex: 1; min-width: 150px; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <button onclick="postShipment('staff')" class="submit-btn" style="margin-top: 0;">新增</button>
                    </div>
                </div>
            </div>

            <div class="add-work-form">
                <h3>➕ 新增工作</h3>
                <form id="addWorkForm">
                    <div class="form-group">
                        <label>工作名稱 *</label>
                        <input type="text" id="workTitle" placeholder="例如：差單 #20250705" required>
                    </div>
                    <div class="form-group">
                        <label>優先度</label>
                        <select id="workPriority">
                            <option value="高">高</option>
                            <option value="中" selected>中</option>
                            <option value="低">低</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>狀態</label>
                        <select id="workStatus">
                            <option value="等待中" selected>等待中</option>
                            <option value="進行中">進行中</option>
                        </select>
                        <p style="font-size: 13px; color: #e67e22; margin-top: 6px;">💡 一次做一件事列於進行中，其餘列於等待中</p>
                    </div>
                    <div class="form-group">
                        <label>特別標記</label>
                        <select id="workFlag" onchange="document.getElementById('workHelperGroup').style.display = this.value === '隊友協助' ? 'block' : 'none'">
                            <option value="" selected>無</option>
                            <option value="主管注意">🚨 需主管注意</option>
                            <option value="隊友協助">🤝 需隊友協助</option>
                        </select>
                    </div>
                    <div class="form-group" id="workHelperGroup" style="display: none;">
                        <label>請誰協助</label>
                        <select id="workHelper"></select>
                    </div>
                    <div class="form-group">
                        <label>備註</label>
                        <textarea id="workNote" placeholder="詳細說明、需要注意的事項等"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">新增</button>
                        <button type="reset" class="cancel-btn">清空</button>
                    </div>
                </form>
            </div>

            <div id="staffWorkList"></div>
        </div>

        <!-- 主管視圖 -->
        <div id="managerView" class="main-view">
            <div class="view-header">
                <h2>🎯 即時戰情室</h2>
                <button class="logout-btn" onclick="logout()">登出</button>
            </div>

            <div id="managerAlerts"></div>

            <div class="announcement-section">
                <h3>📢 公布欄</h3>
                <div id="announcementList"></div>
                <div style="margin-top: 15px; border-top: 1px solid #ffd700; padding-top: 15px;">
                    <textarea id="managerAnnouncement" placeholder="發布訊息..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                        <select id="managerAnnouncementImportance" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                            <option value="普通">普通</option>
                            <option value="重要">重要</option>
                            <option value="緊急">緊急</option>
                        </select>
                        <button onclick="postAnnouncement('christine')" class="submit-btn" style="margin-top: 0; flex: 1;">發布</button>
                    </div>
                </div>
            </div>

            <div class="announcement-section" style="background: #eef5ff; border-color: #7fb3ff;">
                <h3>🚚 近期出貨需求</h3>
                <div id="shipmentList"></div>
                <div style="margin-top: 15px; border-top: 1px solid #7fb3ff; padding-top: 15px;">
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="date" id="managerShipDate" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <input type="text" id="managerShipText" placeholder="客戶 / 品名 / 數量..." style="flex: 1; min-width: 150px; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <button onclick="postShipment('manager')" class="submit-btn" style="margin-top: 0;">新增</button>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid" id="dashboardGrid"></div>

            <div style="background: #f0f0f0; padding: 20px; border-radius: 8px; margin-top: 30px;">
                <h3>⚙️ 人員管理</h3>
                <p style="color: #666; margin-bottom: 15px;">修改生管名字</p>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <div>
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">生管 1</label>
                        <input type="text" id="staffName1" placeholder="Stella" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div>
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">生管 2</label>
                        <input type="text" id="staffName2" placeholder="小樂" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div>
                        <label style="font-weight: bold; display: block; margin-bottom: 5px;">生管 3</label>
                        <input type="text" id="staffName3" placeholder="伶佳" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                </div>
                <button onclick="saveStaffNames()" class="submit-btn" style="margin-bottom: 20px;">💾 保存名字</button>
            </div>

            <div style="background: #f0f0f0; padding: 20px; border-radius: 8px; margin-top: 30px;">
                <h3>📊 工作數據導出</h3>
                <p style="color: #666; margin-bottom: 15px;">導出所有工作詳情，包含接案時間、完成時間、耗時等</p>
                <button onclick="exportToExcel()" class="submit-btn">📥 導出 Excel</button>
            </div>

            <div style="background: #fff3f3; padding: 20px; border-radius: 8px; margin-top: 30px; border: 1px solid #f5c6cb;">
                <h3>🧹 清除已完成工作</h3>
                <p style="color: #666; margin-bottom: 15px;">會先自動下載 Excel 備份，再把所有生管的「完成」項目從看板移除（所有裝置同步生效）</p>
                <button onclick="clearCompletedWorks()" class="submit-btn" style="background: #dc3545;">🧹 備份並清除已完成</button>
            </div>
        </div>

        <!-- 查看視圖 (Penny) -->
        <div id="viewerView" class="main-view">
            <div class="view-header">
                <h2>👑 全員工作總覽</h2>
                <button class="logout-btn" onclick="logout()">登出</button>
            </div>

            <div class="announcement-section">
                <h3>📢 公布欄</h3>
                <div id="viewerAnnouncementList"></div>
                <div style="margin-top: 15px; border-top: 1px solid #ffd700; padding-top: 15px;">
                    <textarea id="viewerAnnouncement" placeholder="分享訊息..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                        <select id="viewerAnnouncementImportance" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                            <option value="普通">普通</option>
                            <option value="重要">重要</option>
                            <option value="緊急">緊急</option>
                        </select>
                        <button onclick="postAnnouncement('penny')" class="submit-btn" style="margin-top: 0; flex: 1;">發布</button>
                    </div>
                </div>
            </div>

            <div class="announcement-section" style="background: #eef5ff; border-color: #7fb3ff;">
                <h3>🚚 近期出貨需求</h3>
                <div id="viewerShipmentList"></div>
                <div style="margin-top: 15px; border-top: 1px solid #7fb3ff; padding-top: 15px;">
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="date" id="viewerShipDate" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <input type="text" id="viewerShipText" placeholder="客戶 / 品名 / 數量..." style="flex: 1; min-width: 150px; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                        <button onclick="postShipment('viewer')" class="submit-btn" style="margin-top: 0;">新增</button>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid" id="viewerDashboardGrid"></div>
        </div>
    </div>

    <!-- 密碼輸入 -->
    <div id="passwordModal" class="password-modal">
        <div class="password-box">
            <h3>主管模式需要密碼</h3>
            <input type="password" id="passwordInput" placeholder="請輸入密碼" onkeypress="if(event.key==='Enter') checkPassword()">
            <div>
                <button class="password-submit" onclick="checkPassword()">確認</button>
                <button class="password-cancel" onclick="cancelPassword()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase 配置（連接雲端資料庫，只需要資料庫網址）
        const firebaseConfig = {
            databaseURL: "https://super-ting-default-rtdb.firebaseio.com"
        };

        // 初始化 Firebase
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.log("Firebase 初始化失敗，使用本地模式", e);
        }

        // 資料結構
        let currentUser = null;
        let pendingUser = null;
        const USER_PASSWORDS = {
            christine: 'GA4331',
            xiaole: '12345',
            stella: '0703'
        };
        const staffNames = {
            stella: 'Stella',
            xiaole: '小樂',
            lingjia: '伶佳'
        };

        // 共用資料（透過雲端在所有裝置間即時同步）
        let appData = {
            works: {},
            announcements: [],
            shipments: [],
            customStaffNames: {}
        };

        // 右上角同步狀態指示燈
        function setSyncStatus(connected) {
            let badge = document.getElementById('syncStatus');
            if (!badge) {
                badge = document.createElement('div');
                badge.id = 'syncStatus';
                badge.style.cssText = 'position:fixed;top:8px;right:8px;z-index:9999;padding:4px 10px;border-radius:12px;font-size:12px;color:white;box-shadow:0 2px 6px rgba(0,0,0,0.2);';
                document.body.appendChild(badge);
            }
            if (connected) {
                badge.textContent = '🟢 雲端同步中';
                badge.style.background = '#28a745';
            } else {
                badge.textContent = '🔴 離線（僅本機）';
                badge.style.background = '#dc3545';
            }
        }

        // Firebase 會把陣列轉成物件，讀回來時統一轉回陣列
        function normalizeWorks(v) {
            const works = {};
            if (!v) return works;
            Object.keys(v).forEach(user => {
                const list = v[user];
                works[user] = Array.isArray(list) ? list.filter(Boolean) : Object.values(list || {});
            });
            return works;
        }

        // 初始化資料
        function initData() {
            // 先載入本機快取，離線時也看得到資料
            appData.works = JSON.parse(localStorage.getItem('works') || '{}');
            appData.announcements = JSON.parse(localStorage.getItem('announcements') || '[]');
            appData.shipments = JSON.parse(localStorage.getItem('shipments') || '[]');
            appData.customStaffNames = JSON.parse(localStorage.getItem('customStaffNames') || '{}');
            loadStaffNames();

            if (!db) {
                setSyncStatus(false);
                return;
            }

            // 監聽連線狀態
            db.ref('.info/connected').on('value', snap => setSyncStatus(snap.val() === true));

            // 資料搬家：把這台裝置的本機資料「合併」上傳到雲端
            // （只補上雲端沒有的項目，不會覆蓋其他裝置已上傳的資料）
            const localWorks = appData.works;
            const localAnnouncements = appData.announcements;
            const localNames = appData.customStaffNames;

            db.ref('works').once('value').then(snap => {
                const cloud = normalizeWorks(snap.val());
                let changed = false;
                Object.keys(localWorks).forEach(user => {
                    const cloudList = cloud[user] || [];
                    const cloudIds = {};
                    cloudList.forEach(w => { if (w && w.id) cloudIds[w.id] = true; });
                    (localWorks[user] || []).forEach(w => {
                        if (w && w.id && !cloudIds[w.id]) {
                            cloudList.push(w);
                            changed = true;
                        }
                    });
                    if (cloudList.length > 0) cloud[user] = cloudList;
                });
                if (changed) db.ref('works').set(cloud);
            });
            db.ref('announcements').once('value').then(snap => {
                const v = snap.val();
                const cloud = v ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v)) : [];
                const cloudIds = {};
                cloud.forEach(a => { if (a && a.id) cloudIds[a.id] = true; });
                let changed = false;
                localAnnouncements.forEach(a => {
                    if (a && a.id && !cloudIds[a.id]) {
                        cloud.push(a);
                        changed = true;
                    }
                });
                if (changed) db.ref('announcements').set(cloud);
            });
            db.ref('customStaffNames').once('value').then(snap => {
                if (!snap.exists() && Object.keys(localNames).length > 0) {
                    db.ref('customStaffNames').set(localNames);
                }
            });

            // 即時監聽雲端資料，任何裝置修改都會立刻同步到這裡
            db.ref('works').on('value', snap => {
                appData.works = normalizeWorks(snap.val());
                localStorage.setItem('works', JSON.stringify(appData.works));
                rerenderCurrentView();
            });
            db.ref('announcements').on('value', snap => {
                const v = snap.val();
                appData.announcements = v ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v)) : [];
                localStorage.setItem('announcements', JSON.stringify(appData.announcements));
                rerenderCurrentView();
            });
            db.ref('shipments').on('value', snap => {
                const v = snap.val();
                appData.shipments = v ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v)) : [];
                localStorage.setItem('shipments', JSON.stringify(appData.shipments));
                rerenderCurrentView();
            });
            db.ref('customStaffNames').on('value', snap => {
                appData.customStaffNames = snap.val() || {};
                localStorage.setItem('customStaffNames', JSON.stringify(appData.customStaffNames));
                loadStaffNames();
                rerenderCurrentView();
            });
        }

        // 儲存工作資料（本機 + 雲端）
        function saveWorks() {
            localStorage.setItem('works', JSON.stringify(appData.works));
            if (db) db.ref('works').set(appData.works).catch(e => console.log('雲端儲存失敗', e));

        // 渲染工作列表 (按狀態分組)
        function renderWorksByStatus(works, owner, canEdit = false) {
            const statuses = ['進行中', '等待中', '完成'];
            let html = '';

            statuses.forEach(status => {
                const statusWorks = works.filter(w => w.status === status);
                if (statusWorks.length === 0) return;

                html += `<div class="work-section">
                    <h3>${status} (${statusWorks.length})</h3>`;

                statusWorks.forEach(work => {
                    html += renderWorkItem(work, owner, canEdit);
                });

                html += '</div>';
            });

            return html;
        }

        // 解析中文格式時間字串（例如 2026/7/2 上午9:30:15）
        function parseZhDate(s) {
            if (!s) return null;
            let str = String(s);
            const pm = str.indexOf('下午') >= 0;
            str = str.replace('上午', ' ').replace('下午', ' ');
            const d = new Date(str);
            if (isNaN(d.getTime())) return null;
            if (pm && d.getHours() < 12) d.setHours(d.getHours() + 12);
            return d;
        }

        // 接案至今的天數標籤（未完成的工作才顯示，越久顏色越深）
        function pendingBadge(work) {
            if (work.status === '完成' || !work.createdAt) return '';
            const created = parseZhDate(work.createdAt);
            if (!created) return '';

            const ms = new Date() - created;
            const days = Math.floor(ms / 86400000);
            const hours = Math.floor(ms / 3600000);
            if (ms < 0) return '';

            const text = days >= 1 ? `已接案 ${days} 天` : `已接案 ${hours} 小時`;
            const color = days >= 7 ? '#dc3545' : days >= 3 ? '#fd7e14' : '#6c757d';
            return ` <span style="background: ${color}; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap;">📌 ${text}</span>`;
        }

        // 單項工作顯示
        function renderWorkItem(work, owner, canEdit = false) {
            const statusClass = `status-${work.status === '進行中' ? 'doing' : work.status === '等待中' ? 'waiting' : 'done'}`;
            const statusMap = { '進行中': 'doing', '等待中': 'waiting', '完成': 'done' };

            // 計算耗時
            let durationText = '';
            if (work.createdAt) {
                const createdDate = new Date(work.createdAt);
                const completedDate = work.completedAt ? new Date(work.completedAt) : new Date();
                const durationMs = completedDate - createdDate;
                const durationHours = Math.floor(durationMs / (1000 * 60 * 60));
                const durationDays = Math.floor(durationMs / (1000 * 60 * 60 * 24));

                if (durationDays > 0) {
                    durationText = `⏱️ ${durationDays}天${durationHours % 24}小時`;
                } else if (durationHours > 0) {
                    durationText = `⏱️ ${durationHours}小時`;
                }
            }

            let html = `<div class="work-item">
                <div class="work-content">
                    <div class="work-title">${work.title}</div>`;

            if (work.note) html += `<div class="work-note">📝 ${work.note}</div>`;

            if (work.managerNote) html += `<div class="work-note" style="background: #fff8e1; border-left: 3px solid #f0ad4e; padding: 4px 8px; margin-top: 4px; border-radius: 3px;">👑 Christine 留言：${work.managerNote}</div>`;

            // 顯示時間信息
            let timeInfo = '';
            if (work.createdAt) {
                const createdTime = new Date(work.createdAt).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                timeInfo += `📅 接案: ${createdTime}`;
            }
            if (work.completedAt) {
                const completedTime = new Date(work.completedAt).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                timeInfo += ` | 完成: ${completedTime}`;
            }
            if (durationText) {
                timeInfo += ` | ${durationText}`;
            }

            if (timeInfo) html += `<div class="work-note" style="color: #999; font-size: 11px;">${timeInfo}</div>`;

            html += `<span class="work-status ${statusClass}">${work.status}</span>`;
            html += pendingBadge(work);
            if (work.priority) html += ` <span style="font-size: 12px; color: #666;">優先度: ${work.priority}</span>`;

            if (work.flag === '主管注意') html += ` <span style="background: #dc3545; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap;">🚨 需主管注意</span>`;
            if (work.flag === '隊友協助') html += ` <span style="background: #17a2b8; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap;">🤝 需 ${staffNames[work.helper] || '隊友'} 協助</span>`;

            html += `</div><div class="work-actions">`;

            if (canEdit && owner === currentUser) {
                // 狀態轉換
                html += `<select class="work-btn" style="background: #667eea; color: white; padding: 6px; border: none; border-radius: 4px;" onchange="updateWorkStatus('${work.id}', this.value)">
                    <option value="">改狀態</option>
                    <option value="進行中">進行中</option>
                    <option value="等待中">等待中</option>
                    <option value="完成">完成</option>
                </select>`;
                html += `<button class="work-btn edit-btn" onclick="editWork('${work.id}')">編輯</button>`;
                html += `<button class="work-btn delete-btn" onclick="deleteWork('${work.id}')">刪除</button>`;
            }

            // 主管可對任何工作留言
            if (currentUser === 'christine') {
                html += `<button class="work-btn" style="background: #f0ad4e; color: white;" onclick="editManagerNote('${work.id}')">👑 留言</button>`;
            }

            html += `</div></div>`;
            return html;
        }

        // 主管留言（新增/修改，清空內容即刪除留言）
        function editManagerNote(workId) {
            if (currentUser !== 'christine') {
                alert('只有主管可以留言');
                return;
            }

            let target = null;
            Object.keys(appData.works).forEach(user => {
                const work = (appData.works[user] || []).find(w => w.id === workId);
                if (work) target = work;
            });

            if (!target) return;

            const input = prompt('主管留言（清空內容並確認 = 刪除留言）:', target.managerNote || '');
            if (input === null) return; // 按取消

            if (input.trim()) {
                target.managerNote = input.trim();
            } else {
                delete target.managerNote;
            }

            saveWorks();
            rerenderCurrentView();
        }

        // 導出 Excel
        function exportToExcel() {
            const works = appData.works;
            let data = [];

            Object.keys(staffNames).forEach(user => {
                const userWorks = works[user] || [];
                userWorks.forEach(work => {
                    const createdDate = work.createdAt ? new Date(work.createdAt) : null;
                    const completedDate = work.completedAt ? new Date(work.completedAt) : null;

                    let duration = '';
                    if (createdDate && completedDate && work.status === '完成') {
                        const durationMs = completedDate - createdDate;
                        const durationDays = Math.floor(durationMs / (1000 * 60 * 60 * 24));
                        const durationHours = Math.floor((durationMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        duration = durationDays > 0 ? `${durationDays}天${durationHours}小時` : `${durationHours}小時`;
                    }

                    data.push({
                        '生管': staffNames[user],
                        '工作名稱': work.title,
                        '優先度': work.priority || '中',
                        '狀態': work.status,
                        '接案時間': work.createdAt || '',
                        '完成時間': work.completedAt || '',
                        '耗時': duration,
                        '備註': work.note || '',
                        '主管留言': work.managerNote || '',
                        '特別標記': work.flag === '主管注意' ? '需主管注意' : work.flag === '隊友協助' ? `需${staffNames[work.helper] || '隊友'}協助` : ''
                    });
                });
            });

            if (data.length === 0) {
                alert('目前沒有工作數據');
                return;
            }

            // 使用 SheetJS 生成 Excel
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '工作清單');

            // 設定列寬
            worksheet['!cols'] = [
                { wch: 12 },  // 生管
                { wch: 20 },  // 工作名稱
                { wch: 8 },   // 優先度
                { wch: 8 },   // 狀態
                { wch: 18 },  // 接案時間
                { wch: 18 },  // 完成時間
                { wch: 12 },  // 耗時
                { wch: 30 },  // 備註
                { wch: 30 },  // 主管留言
                { wch: 15 }   // 特別標記
            ];

            // 下載文件
            const fileName = `生管工作清單_${new Date().toLocaleDateString('zh-TW').replace(/\//g, '-')}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }

        // 主管專用：備份並清除所有已完成工作
        function clearCompletedWorks() {
            if (currentUser !== 'christine') {
                alert('只有主管可以清除已完成工作');
                return;
            }

            let count = 0;
            Object.keys(appData.works).forEach(user => {
                count += (appData.works[user] || []).filter(w => w.status === '完成').length;
            });

            if (count === 0) {
                alert('目前沒有已完成的工作');
                return;
            }

            if (!confirm(`共有 ${count} 項已完成的工作。\n\n將先自動下載 Excel 備份，然後從看板清除這些項目（所有裝置都會同步移除）。\n\n確定要繼續嗎？`)) {
                return;
            }

            exportToExcel();

            Object.keys(appData.works).forEach(user => {
                appData.works[user] = (appData.works[user] || []).filter(w => w.status !== '完成');
            });
            saveWorks();
            renderDashboard('manager');

            alert(`✅ 已清除 ${count} 項已完成工作，備份已下載到你的電腦`);
        }

        window.addEventListener('load', function() {
            initData();
            attachFormListener();
        });

        function addWork(user, title, priority, note, flag, helper, status) {
            if (!appData.works[user]) appData.works[user] = [];

            const work = {
                id: Date.now().toString(),
                title: title,
                priority: priority,
                note: note,
                status: status || '等待中',
                createdAt: new Date().toLocaleString('zh-TW')
            };
            if (flag) work.flag = flag;
            if (flag === '隊友協助' && helper) work.helper = helper;

            appData.works[user].push(work);

            saveWorks();
        }

        // 更新工作狀態
        function updateWorkStatus(workId, newStatus) {
            Object.keys(appData.works).forEach(user => {
                const work = appData.works[user].find(w => w.id === workId);
                if (work) {
                    work.status = newStatus;
                    // 記錄完成時間
                    if (newStatus === '完成') {
                        work.completedAt = new Date().toLocaleString('zh-TW');
                    } else {
                        // 如果改回進行中或等待中，清除完成時間
                        delete work.completedAt;
                    }
                }
            });
            saveWorks();
            renderStaffView(currentUser);
        }

        // 刪除工作
        function deleteWork(workId) {
            if (confirm('確定要刪除這項工作嗎？')) {
                appData.works[currentUser] = (appData.works[currentUser] || []).filter(w => w.id !== workId);
                saveWorks();
                renderStaffView(currentUser);
            }
        }

        // 編輯工作 (簡化版)
        function editWork(workId) {
            const work = (appData.works[currentUser] || []).find(w => w.id === workId);
            if (work) {
                const newTitle = prompt('工作名稱:', work.title);
                if (newTitle) {
                    work.title = newTitle;
                    work.note = prompt('備註:', work.note);
                    saveWorks();
                    renderStaffView(currentUser);
                }
            }
        }

        // 戰情室
        function renderDashboard(view = 'manager') {
            const works = appData.works;
            let html = '';

            Object.keys(staffNames).forEach(user => {
                const userWorks = works[user] || [];
                const doing = userWorks.filter(w => w.status === '進行中').length;
                const waiting = userWorks.filter(w => w.status === '等待中').length;
                const done = userWorks.filter(w => w.status === '完成').length;

                html += `<div class="staff-card">
                    <div class="staff-name">${staffNames[user]}</div>
                    <div class="stats">
                        <div class="stat"><div class="stat-label">進行中</div><div class="stat-value">${doing}</div></div>
                        <div class="stat"><div class="stat-label">等待中</div><div class="stat-value">${waiting}</div></div>
                        <div class="stat"><div class="stat-label">完成</div><div class="stat-value">${done}</div></div>
                    </div>
                    <div>${renderWorksByStatus(userWorks, user, false)}</div>
                </div>`;
            });

            const gridId = view === 'manager' ? 'dashboardGrid' : 'viewerDashboardGrid';
            document.getElementById(gridId).innerHTML = html;

            if (view === 'manager') renderAlerts('manager');
        }

        // 公布欄
        function postAnnouncement(author) {
            let textareaId, importanceId, viewType;

            if (author === 'christine') {
                textareaId = 'managerAnnouncement';
                importanceId = 'managerAnnouncementImportance';
                viewType = 'manager';
            } else {
                textareaId = 'viewerAnnouncement';
                importanceId = 'viewerAnnouncementImportance';
                viewType = 'viewer';
            }

            const text = document.getElementById(textareaId).value;
            const importance = document.getElementById(importanceId).value;

            if (!text.trim()) {
                alert('請輸入訊息');
                return;
            }

            const authorName = author === 'christine' ? 'Christine' : 'Penny';
            const importanceOrder = { '緊急': 0, '重要': 1, '普通': 2 };

            appData.announcements.push({
                id: Date.now().toString(),
                author: authorName,
                text: text,
                time: new Date().toLocaleString('zh-TW'),
                importance: importance,
                importanceOrder: importanceOrder[importance]
            });

            saveAnnouncements();
            document.getElementById(textareaId).value = '';
            document.getElementById(importanceId).value = '普通';
            loadAnnouncements(viewType);
        }

        function postAnnounceAsStaff() {
            const text = document.getElementById('staffAnnouncement').value;
            const importance = document.getElementById('staffAnnouncementImportance').value;

            if (!text.trim()) {
                alert('請輸入訊息');
                return;
            }

            const authorName = staffNames[currentUser];
            const importanceOrder = { '緊急': 0, '重要': 1, '普通': 2 };

            appData.announcements.push({
                id: Date.now().toString(),
                author: authorName,
                text: text,
                time: new Date().toLocaleString('zh-TW'),
                importance: importance,
                importanceOrder: importanceOrder[importance]
            });

            saveAnnouncements();
            document.getElementById('staffAnnouncement').value = '';
            document.getElementById('staffAnnouncementImportance').value = '普通';
            loadAnnouncements('staff');
        }

        function deleteAnnouncement(annId) {
            if (currentUser !== 'christine') {
                alert('只有主管可以刪除公告');
                return;
            }

            if (confirm('確定要刪除這則公告嗎？')) {
                appData.announcements = appData.announcements.filter(a => a.id !== annId);
                saveAnnouncements();

                const currentView = document.getElementById('staffView').classList.contains('active') ? 'staff' :
                                  document.getElementById('managerView').classList.contains('active') ? 'manager' : 'viewer';
                loadAnnouncements(currentView);
            }
        }

        function loadAnnouncements(view) {
            let announcements = appData.announcements.slice();

            // 按重要性排序（緊急 > 重要 > 普通）
            announcements.sort((a, b) => (a.importanceOrder || 2) - (b.importanceOrder || 2));

            let html = '';

            announcements.forEach(ann => {
                const importanceEmoji = ann.importance === '緊急' ? '🚨' : ann.importance === '重要' ? '⚠️' : '📌';
                const deleteBtn = currentUser === 'christine' ? `<button class="work-btn delete-btn" style="margin-left: auto;" onclick="deleteAnnouncement('${ann.id}')">刪除</button>` : '';

                html += `<div class="announcement-item">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span>${importanceEmoji} ${ann.importance}</span>
                            <strong>${ann.text}</strong>
                        </div>
                        <div class="announcement-author">📝 ${ann.author}</div>
                        <div class="announcement-time">${ann.time}</div>
                    </div>
                    ${deleteBtn}
                </div>`;
            });

            const elementMap = {
                'staff': 'staffAnnouncementList',
                'manager': 'announcementList',
                'viewer': 'viewerAnnouncementList'
            };

            const elementId = elementMap[view];
            if (elementId) {
                document.getElementById(elementId).innerHTML = html || '<p style="color: #999;">暫無公告</p>';
            }
        }

        // ===== 近期出貨需求 =====

        // 依出貨日期計算急迫度標籤
        function shipmentBadge(dateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const d = new Date(dateStr + 'T00:00:00');
            const diff = Math.round((d - today) / 86400000);

            if (isNaN(diff)) return { text: '', color: '#6c757d' };
            if (diff < 0) return { text: `已逾期 ${-diff} 天`, color: '#dc3545' };
            if (diff === 0) return { text: '今天出貨', color: '#dc3545' };
            if (diff <= 3) return { text: `${diff} 天後`, color: '#fd7e14' };
            return { text: `${diff} 天後`, color: '#28a745' };
        }

        // 新增出貨需求
        function postShipment(view) {
            const idMap = {
                staff: ['staffShipDate', 'staffShipText'],
                manager: ['managerShipDate', 'managerShipText'],
                viewer: ['viewerShipDate', 'viewerShipText']
            };
            const [dateId, textId] = idMap[view];
            const date = document.getElementById(dateId).value;
            const text = document.getElementById(textId).value;

            if (!date) {
                alert('請選擇出貨日期');
                return;
            }
            if (!text.trim()) {
                alert('請填入出貨內容（客戶 / 品名 / 數量）');
                return;
            }

            const authorName = view === 'manager' ? 'Christine' : view === 'viewer' ? 'Penny' : staffNames[currentUser];

            appData.shipments.push({
                id: Date.now().toString(),
                date: date,
                text: text.trim(),
                author: authorName,
                time: new Date().toLocaleString('zh-TW')
            });

            saveShipments();
            document.getElementById(dateId).value = '';
            document.getElementById(textId).value = '';
            loadShipments(view);
        }

        // 刪除出貨需求（僅主管）
        function deleteShipment(shipId) {
            if (currentUser !== 'christine') {
                alert('只有主管可以刪除出貨需求');
                return;
            }

            if (confirm('確定要刪除這筆出貨需求嗎？')) {
                appData.shipments = appData.shipments.filter(s => s.id !== shipId);
                saveShipments();

                const currentView = document.getElementById('staffView').classList.contains('active') ? 'staff' :
                                  document.getElementById('managerView').classList.contains('active') ? 'manager' : 'viewer';
                loadShipments(currentView);
            }
        }

        // 顯示出貨需求（依出貨日期由近到遠排序）
        function loadShipments(view) {
            const shipments = appData.shipments.slice();
            shipments.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));

            let html = '';

            shipments.forEach(ship => {
                const badge = shipmentBadge(ship.date);
                const dateDisplay = ship.date ? ship.date.replace(/^\d{4}-/, '').replace('-', '/') : '';
                const deleteBtn = currentUser === 'christine' ? `<button class="work-btn delete-btn" style="margin-left: auto;" onclick="deleteShipment('${ship.id}')">刪除</button>` : '';

                html += `<div class="announcement-item">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                            <span style="background: ${badge.color}; color: white; padding: 2px 10px; border-radius: 10px; font-size: 12px; white-space: nowrap;">📅 ${dateDisplay} ${badge.text}</span>
                            <strong>${ship.text}</strong>
                        </div>
                        <div class="announcement-author">📝 ${ship.author}</div>
                        <div class="announcement-time">${ship.time}</div>
                    </div>
                    ${deleteBtn}
                </div>`;
            });

            const elementMap = {
                'staff': 'staffShipmentList',
                'manager': 'shipmentList',
                'viewer': 'viewerShipmentList'
            };

            const elementId = elementMap[view];
            if (elementId) {
                document.getElementById(elementId).innerHTML = html || '<p style="color: #999;">暫無出貨需求</p>';
            }
        }
    </script>
</body>
</html>
